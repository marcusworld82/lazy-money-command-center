<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARCO. Shell Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F0E0E; --panel:#1A1818; --panel-2:#211E1E; --line:#2E2A2A; --line-2:#3A3434;
  --red:#AD0000; --red-hi:#E01414; --pink:#FF3D8A;
  --txt:#F2EFEF; --txt-dim:#8B8383; --txt-mute:#5E5757;
  --rail:266px; --work:364px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:Archivo,'Helvetica Neue',Arial,sans-serif;font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--txt-mute);font-weight:700}
.eyebrow .bar{display:inline-block;width:12px;height:2px;background:var(--red);vertical-align:middle;margin-right:7px;position:relative;top:-1px}

.app{display:grid;grid-template-columns:var(--rail) 1fr var(--work);height:100vh;border-top:2px solid var(--red)}
.app.no-work{grid-template-columns:var(--rail) 1fr 0}

/* avatar */
.av{border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;position:relative}
.av img{width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}

/* rail */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:15px 16px 14px;border-bottom:1px solid var(--line)}
.mark{width:32px;height:32px;border-radius:9px;background:var(--red);display:grid;place-items:center;overflow:hidden}
.mark img{width:26px;height:26px;object-fit:contain}
.brand h1{font-size:17px;font-weight:900;letter-spacing:.06em}
.brandsub{font-size:9px;color:var(--txt-mute);letter-spacing:.18em;text-transform:uppercase;margin-top:1px}

.ctx{margin:12px 12px 2px;padding:9px 11px;border:1px solid var(--line);border-left:2px solid var(--red);border-radius:9px;display:flex;align-items:center;justify-content:space-between;background:var(--panel-2)}
.ctx .lbl{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--txt-mute)}
.ctx .val{font-size:13px;font-weight:700;margin-top:2px}
.ctx .chev{color:var(--txt-mute);font-size:11px}

.railscroll{flex:1;overflow-y:auto;padding:10px 12px 20px;min-height:0}
.railscroll::-webkit-scrollbar{width:6px}.railscroll::-webkit-scrollbar-thumb{background:#2E2A2A;border-radius:3px}
.sect{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 8px}
.newbtn{font-size:15px;color:var(--txt-mute);line-height:1;padding:0 5px;border:1px solid var(--line);border-radius:6px}
.newbtn:hover{color:#fff;border-color:var(--red);background:var(--red)}

.thread{display:flex;gap:10px;padding:8px 10px;border-radius:9px;align-items:center;width:100%;text-align:left;transition:background .12s}
.thread:hover{background:#232020}
.thread.on{background:linear-gradient(90deg,#2E1111,#232020);box-shadow:inset 2px 0 0 var(--red)}
.thread .av{width:26px;height:26px}
.thread .meta{min-width:0;flex:1}
.thread .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.thread .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .tm{font-size:10px;color:var(--txt-mute);flex:none}
.thread .pv{font-size:11.5px;color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.thread .flag{width:6px;height:6px;border-radius:50%;background:var(--red-hi);flex:none}

.navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;width:100%;text-align:left;color:var(--txt-dim);font-size:13px}
.navitem:hover{background:#232020;color:var(--txt)}
.navitem.on{background:#232020;color:var(--txt);font-weight:700;box-shadow:inset 2px 0 0 var(--red)}
.ico{width:15px;text-align:center;font-size:13px;opacity:.85}
.pill{margin-left:auto;font-size:9px;letter-spacing:.08em;color:var(--txt-mute);border:1px solid var(--line);border-radius:20px;padding:1px 6px}
.pill.hot{color:#fff;background:var(--red);border-color:var(--red);font-weight:700}

/* center */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding:0 18px;height:56px;border-bottom:1px solid var(--line);flex:none}
.title{display:flex;align-items:center;gap:10px;min-width:0}
.title .av{width:28px;height:28px}
.title h2{font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.tagline{font-size:11px;color:var(--txt-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid var(--line);padding-left:12px}
.views{margin-left:auto;display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.views button{padding:5px 15px;border-radius:7px;font-size:12px;font-weight:700;color:var(--txt-dim);letter-spacing:.02em}
.views button:hover{color:var(--txt)}
.views button.on{background:var(--red);color:#fff}
.views.hidden{display:none}
.iconbtn{width:31px;height:31px;border-radius:8px;display:grid;place-items:center;color:var(--txt-dim);border:1px solid var(--line)}
.iconbtn:hover{color:#fff;border-color:var(--red)}

.stage{flex:1;overflow-y:auto;min-height:0}
.stage::-webkit-scrollbar{width:8px}.stage::-webkit-scrollbar-thumb{background:#2E2A2A;border-radius:4px}
.pad{padding:22px 24px 30px;max-width:830px}
.pagehd{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}
.pagehd h3{font-size:20px;font-weight:800;letter-spacing:-.02em}
.pagehd .sub{font-size:11.5px;color:var(--txt-mute)}

/* chat */
.msg{margin-bottom:18px;max-width:640px}
.who{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-mute);margin-bottom:6px;font-weight:700;display:flex;align-items:center;gap:6px}
.who .av{width:15px;height:15px}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.55;font-size:13.5px;color:#DCD7D7}
.bub.me{background:#F2EFEF;color:#141212;border-color:#F2EFEF}
.msg.mine{margin-left:auto}.msg.mine .who{justify-content:flex-end}

.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;margin-bottom:18px;max-width:640px}
.card.alert{border-color:#5A1414;box-shadow:0 0 0 1px rgba(173,0,0,.25)}
.card .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.card.alert .hd{background:linear-gradient(90deg,#2B0F0F,#211E1E)}
.card .hd .t{font-size:11.5px;font-weight:800;letter-spacing:.06em}
.tag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:20px;font-weight:800;margin-left:auto}
.tag.hand{background:rgba(255,61,138,.15);color:var(--pink)}
.tag.wait{background:var(--red);color:#fff}
.tag.ok{background:rgba(70,180,110,.15);color:#5FCB8C}
.card .bd{padding:13px 14px;font-size:13px;line-height:1.6;color:#CFC9C9}
.kv{display:grid;grid-template-columns:104px 1fr;gap:5px 12px;font-size:12.5px;margin-top:10px}
.kv dt{color:var(--txt-mute)}.kv dd{color:#DCD7D7}
.acts{display:flex;gap:8px;padding:11px 14px;border-top:1px solid var(--line)}
.btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;border:1px solid var(--line);color:var(--txt-dim)}
.btn:hover{color:var(--txt);border-color:var(--line-2)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{color:#fff;background:var(--red-hi);border-color:var(--red-hi)}
.composer{flex:none;border-top:1px solid var(--line);padding:12px 24px 16px}
.cbox{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px;max-width:830px}
.cbox:focus-within,.cbox:hover{border-color:var(--line-2)}
.cbox span{color:var(--txt-mute);flex:1;font-size:13px}
.chip{font-size:11px;color:var(--txt-dim);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.chip.send{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}

/* build */
.bgrid{display:grid;grid-template-columns:1fr;gap:0}
.blk{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:14px;overflow:hidden}
.blk>.bh{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.blk>.bh .n{width:17px;height:17px;border-radius:5px;background:var(--red);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center}
.blk>.bh .t{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.blk>.bb{padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field{margin-bottom:0}
.field label{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-mute);margin-bottom:6px;font-weight:700}
.inp{border:1px solid var(--line);background:#151313;border-radius:9px;padding:9px 12px;font-size:13px;color:#DCD7D7;display:flex;justify-content:space-between;align-items:center;gap:8px}
.inp:hover{border-color:var(--line-2)}
.inp .cv{color:var(--txt-mute);font-size:11px;flex:none}
.inp.ta{min-height:76px;align-items:flex-start;line-height:1.55}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{width:70px;height:70px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;font-size:9px;color:var(--txt-dim);text-align:center;line-height:1.35;padding:4px;font-weight:600}
.slot b{display:block;font-size:13px;color:var(--txt);font-weight:800}
.slot.add{border-style:dashed;color:var(--txt-mute)}
.slot.add:hover{border-color:var(--red);color:var(--red-hi)}
.rolebar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.role{font-size:10.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--txt-dim)}
.role b{color:var(--txt);font-weight:700}
.runbar{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:12px;padding:13px 15px;background:var(--panel)}
.cost{font-size:12px;color:var(--txt-mute)}.cost b{color:var(--txt);font-weight:800;font-size:15px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg span{flex:1;text-align:center;padding:8px 0;font-size:12px;color:var(--txt-dim);border-right:1px solid var(--line)}
.seg span:last-child{border-right:0}
.seg span.on{background:var(--red);color:#fff;font-weight:700}

/* canvas */
.canvaswrap{display:grid;grid-template-columns:172px 1fr;gap:12px;height:470px}
.palette{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:11px;overflow-y:auto}
.pgrp{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-mute);font-weight:700;margin:10px 2px 7px}
.pgrp:first-child{margin-top:0}
.pnode{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:11.5px;color:var(--txt-dim);margin-bottom:6px;cursor:grab;display:flex;align-items:center;gap:7px}
.pnode:hover{border-color:var(--line-2);color:var(--txt)}
.pnode i{width:6px;height:6px;border-radius:2px;flex:none;font-style:normal}
.canvas{position:relative;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 1px 1px,#262222 1px,transparent 0) 0 0/22px 22px,var(--panel);overflow:hidden}
.ctools{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:7px;z-index:3;align-items:center}
.ctool{font-size:11px;border:1px solid var(--line);background:#191717;border-radius:7px;padding:5px 10px;color:var(--txt-dim)}
.ctool.on{border-color:var(--red);color:#fff;background:var(--red)}
.node{position:absolute;width:154px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:9px 11px;z-index:2}
.node .nt{font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--txt-mute);font-weight:800;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.node .nt i{width:5px;height:5px;border-radius:50%;font-style:normal}
.node .nb{font-size:12px;font-weight:700;line-height:1.35}
.node .ns{font-size:10px;color:var(--txt-mute);margin-top:4px}
.node.appr{border-color:var(--red);box-shadow:0 0 0 1px rgba(173,0,0,.35)}
.node .h{position:absolute;width:8px;height:8px;border-radius:50%;background:#4a4343;border:1px solid var(--panel);top:50%;margin-top:-4px}
.node .h.l{left:-5px}.node .h.r{right:-5px}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.savedbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.saved{cursor:pointer;font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:6px 11px;color:var(--txt-dim)}
.saved:hover{border-color:var(--line-2);color:var(--txt)}
.saved.on{border-color:var(--red);color:#fff;background:rgba(173,0,0,.18);font-weight:700}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .dh{padding:8px;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--txt-mute);border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:var(--panel-2);font-weight:800}
.cal .cell{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;background:var(--panel)}
.cal .cell.today{background:#1F1919;box-shadow:inset 0 2px 0 var(--red)}
.cal .dnum{font-size:10px;color:var(--txt-mute);margin-bottom:5px}
.post{font-size:10px;border-radius:5px;padding:3px 5px;margin-bottom:3px;line-height:1.25;border-left:2px solid}
.post.ig{background:rgba(255,61,138,.12);border-color:var(--pink);color:#F0B9CE}
.post.tt{background:rgba(173,0,0,.18);border-color:var(--red);color:#F3AEAE}
.post.yt{background:#262222;border-color:#5E5757;color:var(--txt-dim)}

/* spend */
.hero{border:1px solid var(--line);border-radius:14px;background:linear-gradient(120deg,#241414 0%,#1A1818 55%);padding:20px 22px;margin-bottom:14px;display:flex;align-items:flex-end;gap:34px}
.hero .big{font-size:46px;font-weight:900;letter-spacing:-.035em;line-height:1}
.hero .big em{font-style:normal;color:var(--red-hi)}
.hero .lab{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--txt-mute);margin-bottom:8px;font-weight:700}
.hero .sm{font-size:19px;font-weight:800}
.hero .smlab{font-size:10px;color:var(--txt-mute);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.bars{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:15px}
.bar{display:grid;grid-template-columns:74px 1fr 58px;align-items:center;gap:11px;margin-bottom:9px;font-size:12px}
.bar .nm{color:var(--txt-dim);display:flex;align-items:center;gap:7px}
.bar .nm .av{width:17px;height:17px}
.track{height:8px;border-radius:4px;background:#262222;overflow:hidden}
.fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--red),var(--red-hi))}
.bar .amt{text-align:right;font-weight:800}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.tbl th{text-align:left;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--txt-mute);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:800}
.tbl td{padding:9px 10px;border-bottom:1px solid #232020;color:var(--txt-dim)}
.tbl td b{color:var(--txt);font-weight:700}
.tbl tr:hover td{background:#1E1B1B}
.tbl td.r{text-align:right;color:var(--txt);font-weight:700}
.capbar{display:flex;align-items:center;gap:12px;border:1px solid #5A1414;background:linear-gradient(90deg,#2B0F0F,#1A1818);border-radius:10px;padding:11px 14px;margin-bottom:14px;font-size:12px}
.capbar .track{flex:1}

/* settings */
.setwrap{display:grid;grid-template-columns:186px 1fr;gap:16px}
.setlist{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:8px;height:fit-content}
.setrow{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;width:100%;text-align:left;font-size:12.5px;color:var(--txt-dim)}
.setrow .av{width:22px;height:22px}
.setrow:hover{background:#232020;color:var(--txt)}
.setrow.on{background:#2A1010;color:var(--txt);font-weight:700;box-shadow:inset 2px 0 0 var(--red)}
.toggle{width:34px;height:19px;border-radius:20px;background:#332c2c;position:relative;flex:none}
.toggle:after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#6b6363;top:2px;left:2px}
.toggle.on{background:var(--red)}.toggle.on:after{left:17px;background:#fff}
.permrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #232020;font-size:12.5px}
.permrow:last-child{border-bottom:0}
.permrow .pd{color:var(--txt-mute);font-size:11px;margin-top:2px}
.tri{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.tri span{padding:4px 11px;font-size:11px;color:var(--txt-mute);border-right:1px solid var(--line)}
.tri span:last-child{border-right:0}
.tri span.on{background:var(--red);color:#fff;font-weight:700}
.tri span.no.on{background:#3A3434;color:#fff}

/* knowledge */
.klist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;border-top:2px solid var(--red)}
.kcard h4{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:7px}
.kcard p{font-size:12px;color:var(--txt-dim);line-height:1.55}
.kcard .cnt{font-size:10px;color:var(--txt-mute);margin-top:9px;letter-spacing:.08em;text-transform:uppercase}

/* work */
.work{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.app.no-work .work{display:none}
.workhd{display:flex;align-items:center;gap:9px;padding:0 16px;height:56px;border-bottom:1px solid var(--line);flex:none}
.workhd .wt{font-size:12px;font-weight:800;letter-spacing:.05em}
.workhd .tag{margin-left:auto}
.workbd{flex:1;overflow-y:auto;padding:16px}
.workbd::-webkit-scrollbar{width:6px}.workbd::-webkit-scrollbar-thumb{background:#2E2A2A;border-radius:3px}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.thumb{aspect-ratio:4/5;border-radius:9px;border:1px solid var(--line);display:grid;place-items:end;padding:7px;font-size:9px;color:#c9c2c2}
.thumb.sel{border-color:var(--red);box-shadow:0 0 0 1px rgba(173,0,0,.4)}
.t1{background:linear-gradient(150deg,#3a3232,#1c1919)}
.t2{background:linear-gradient(150deg,#4a2226,#1c1919)}
.t3{background:linear-gradient(150deg,#2b3038,#1c1919)}
.t4{background:linear-gradient(150deg,#3d3528,#1c1919)}
.runmeta{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:12px}
.runmeta .rl{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;color:var(--txt-dim)}
.runmeta .rl b{color:var(--txt);font-weight:700}
.runmeta .rl b.red{color:var(--red-hi)}
.steps{margin-top:12px}
.step{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:12px;color:var(--txt-dim)}
.sdot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:none}
.note{font-size:11px;color:var(--txt-mute);line-height:1.55;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}

/* rail collapse */
.railtoggle{margin-left:auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--txt-mute);border:1px solid var(--line);font-size:12px;flex:none}
.railtoggle:hover{color:#fff;border-color:var(--red);background:var(--red)}
.rail{overflow:hidden}
.app.mini{grid-template-columns:66px 1fr var(--work)}
.app.mini.no-work{grid-template-columns:66px 1fr 0}
.app.mini .brand{flex-direction:column;gap:9px;padding:13px 0 12px;justify-content:center}
.app.mini .brand>div:not(.mark){display:none}
.app.mini .railtoggle{margin:0}
.app.mini .ctx{margin:10px 9px 2px;padding:8px 0;justify-content:center;border-left:1px solid var(--line);border-top:2px solid var(--red)}
.app.mini .ctx>div,.app.mini .ctx .chev{display:none}
.app.mini .ctx:after{content:"CO";font-size:10px;font-weight:800;color:var(--txt-dim);letter-spacing:.05em}
.app.mini .railscroll{padding:8px 9px 20px}
.app.mini .sect{justify-content:center;padding:18px 0 7px}
.app.mini .sect .eyebrow{display:none}
.app.mini .thread,.app.mini .navitem{justify-content:center;padding:9px 0;gap:0;position:relative}
.app.mini .thread .meta,.app.mini .navitem .lbl,.app.mini .pill{display:none}
.app.mini .thread .flag{position:absolute;top:6px;right:12px}
.app.mini .navitem .ico{font-size:15px;width:auto}

.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid transparent;overflow:hidden}
.swatch img{width:78%;height:78%;object-fit:contain}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.picker{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px dashed var(--line-2);color:var(--txt-mute);cursor:pointer;position:relative;overflow:hidden}
.picker:hover{border-color:var(--red);color:var(--red-hi)}
.picker input{position:absolute;inset:0;opacity:0;cursor:pointer;padding:0;border:0}
.picker span{font-size:16px;pointer-events:none}

/* right panel toggle */
.workclose{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--txt-mute);border:1px solid var(--line);font-size:12px;margin-left:8px}
.workclose:hover{color:#fff;border-color:var(--red);background:var(--red)}
.paneltoggle.on{color:#fff;border-color:var(--red);background:var(--red)}

/* magnific style canvas */
.stage.bleed{overflow:hidden}
.stage.bleed .pad{padding:0;max-width:none;height:100%}
.mcanvas{position:relative;height:100%;min-height:520px;overflow:hidden;
  background:radial-gradient(circle at 1px 1px,#232020 1px,transparent 0) 0 0/26px 26px,#141212}
.mdock{position:absolute;left:16px;top:50%;transform:translateY(-50%);z-index:8;background:var(--panel);
  border:1px solid var(--line);border-radius:26px;padding:7px 5px;display:flex;flex-direction:column;gap:3px;box-shadow:0 8px 26px rgba(0,0,0,.5)}
.mdock button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--txt-dim);font-size:15px}
.mdock button:hover{background:#2A2626;color:var(--txt)}
.mdock button.on{background:#fff;color:#141212}
.mdock .sep{height:1px;background:var(--line);margin:4px 7px}
.mtop{position:absolute;left:70px;top:14px;z-index:7;display:flex;gap:7px;align-items:center}
.mchip{font-size:11px;border:1px solid var(--line);background:rgba(26,24,24,.9);border-radius:8px;padding:5px 11px;color:var(--txt-dim);backdrop-filter:blur(6px)}
.mchip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.mfoot{position:absolute;left:70px;right:16px;bottom:14px;z-index:7;display:flex;align-items:center;gap:8px}
.mfoot .sp{margin-left:auto}
.grp{position:absolute;border:1px solid var(--line);border-radius:12px;padding:11px;background:rgba(26,24,24,.55)}
.grp.ref{background:rgba(40,52,72,.35);border-color:#2f3d52}
.grp.prm{background:rgba(22,32,48,.5);border-color:#2b3a4d}
.grp.up{background:rgba(58,36,30,.5);border-color:#4a2f26}
.grp.fin{background:rgba(48,20,20,.42);border-color:#5A1414}
.glabel{position:absolute;top:-19px;left:2px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-mute);font-weight:800}
.tiles{display:grid;gap:6px}
.tile{border-radius:5px;background:linear-gradient(150deg,#3a3232,#1c1919);border:1px solid #2c2727}
.tile.a{background:linear-gradient(150deg,#4a3a2a,#1c1919)}
.tile.b{background:linear-gradient(150deg,#2b3846,#1c1919)}
.tile.c{background:linear-gradient(150deg,#4a2226,#1c1919)}
.tile.d{background:linear-gradient(150deg,#39332c,#1c1919)}
.pcard{border:1px solid #2b3a4d;border-radius:6px;background:rgba(15,20,28,.85);padding:6px}
.pline{height:3px;border-radius:2px;background:#2f3d52;margin-bottom:4px}
.pline.s{width:60%}.pline.m{width:82%}
.ptxt{font-size:7px;color:#6d7d92;line-height:1.5;letter-spacing:.01em}
.sticky{position:absolute;border-radius:4px;padding:8px;font-size:8px;line-height:1.5;color:#3a3020}
.sticky.y{background:#E8C468}.sticky.o{background:#E8A06B}
.mnode{position:absolute;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);padding:7px 10px;z-index:3}
.mnode .nt{font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:var(--txt-mute);font-weight:800;display:flex;gap:5px;align-items:center}
.mnode .nb{font-size:11.5px;font-weight:700;margin-top:2px}
.mnode.appr{border-color:var(--red);box-shadow:0 0 0 1px rgba(173,0,0,.4)}
svg.mwires{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* canvas chat panel */
.cchat{display:flex;flex-direction:column;height:100%}
.cchat .hello{padding:26px 18px 0}
.cchat .hello h3{font-size:26px;font-weight:900;letter-spacing:-.03em}
.cchat .hello p{font-size:12px;color:var(--txt-mute);margin-top:6px}
.cchat .body{flex:1;overflow-y:auto;padding:16px}
.cchat .foot{border-top:1px solid var(--line);padding:12px}
.cbig{border:1px solid var(--line);background:#151313;border-radius:12px;padding:12px}
.cbig .ph{font-size:13px;color:var(--txt-mute)}
.cbig .row{display:flex;align-items:center;gap:8px;margin-top:12px}
.cbig .row .sp{margin-left:auto}
.rnd{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--txt-dim);font-size:13px}
.rnd.go{background:var(--red);border-color:var(--red);color:#fff}

/* mobile */
.mobonly{display:none}
.scrim{display:none}
@media(max-width:900px){
  .app,.app.mini,.app.no-work,.app.mini.no-work{grid-template-columns:1fr;padding-bottom:58px}
  .rail{position:fixed;left:0;top:0;bottom:0;width:284px;z-index:60;transform:translateX(-100%);transition:transform .2s;padding-bottom:58px}
  .app.drawer .rail{transform:none;box-shadow:0 0 60px rgba(0,0,0,.7)}
  .app.mini .rail{width:284px}
  .app.mini .brand>div:not(.mark),.app.mini .thread .meta,.app.mini .navitem span:not(.ico),
  .app.mini .sect .eyebrow,.app.mini .ctx>div:first-child{display:block}
  .app.mini .thread,.app.mini .navitem,.app.mini .brand,.app.mini .sect{justify-content:flex-start;padding:8px 10px}
  .app.mini .ctx:after{content:none}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55}
  .work{position:fixed;left:0;right:0;bottom:58px;top:auto;height:62vh;z-index:50;border-left:0;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;transform:translateY(102%);transition:transform .22s}
  .app.sheet .work{transform:none;box-shadow:0 -14px 40px rgba(0,0,0,.6)}
  .app.no-work .work{display:flex}
  .mobonly{display:grid}
  .tabbar{position:fixed;left:0;right:0;bottom:0;height:58px;background:var(--panel);border-top:1px solid var(--line);
    grid-template-columns:repeat(4,1fr);z-index:70;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--txt-mute);font-weight:700}
  .tabbar button .ti{font-size:16px}
  .tabbar button.on{color:#fff;box-shadow:inset 0 2px 0 var(--red)}
  .pad{padding:16px 14px 24px;max-width:none!important}
  .topbar{padding:0 12px;gap:9px}
  .tagline{display:none}
  .views button{padding:5px 11px;font-size:11px}
  .grid2,.grid3,.klist,.setwrap,.canvaswrap{grid-template-columns:1fr!important}
  .thumbs{grid-template-columns:1fr 1fr!important}
  .hero{flex-wrap:wrap;gap:18px}
  .hero .big{font-size:36px}
  .cal{grid-template-columns:1fr;border:0}
  .cal .dh{display:none}
  .cal .cell{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;min-height:0}
  .tbl th:nth-child(3),.tbl td:nth-child(3){display:none}
  .msg,.card,.cbox{max-width:none}
  .composer{padding:10px 14px 14px}
  .btn,.chip,.saved,.ctool,.role{min-height:34px;display:inline-flex;align-items:center}
  .mdock{flex-direction:row;left:50%;top:auto;bottom:14px;transform:translateX(-50%)}
  .mtop,.mfoot{left:14px}
  .mfoot{bottom:70px}
  .canvasnote{display:block!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim" id="scrim"></div>
  <aside class="rail">
    <div class="brand">
      <div class="mark"><img id="brandIcon" alt=""></div>
      <div><h1>MARCO</h1><div class="brandsub">Command Center</div></div>
      <button class="railtoggle" id="railToggle" title="Collapse sidebar">&#9776;</button>
    </div>
    <div class="ctx">
      <div><div class="lbl">Brand context</div><div class="val">COAD</div></div>
      <div class="chev">&#9662;</div>
    </div>
    <div class="railscroll">
      <div class="sect"><span class="eyebrow"><span class="bar"></span>Threads</span><button class="newbtn" data-page="newagent" title="New agent">+</button></div>
      <div id="threads"></div>
      <div class="sect"><span class="eyebrow"><span class="bar"></span>Library</span></div>
      <button class="navitem" data-page="calendar"><span class="ico">&#9635;</span><span class="lbl">Calendar</span><span class="pill">9</span></button>
      <button class="navitem" data-page="automations"><span class="ico">&#9889;</span><span class="lbl">Automations</span><span class="pill hot">1</span></button>
      <button class="navitem" data-page="assets"><span class="ico">&#9744;</span><span class="lbl">Assets</span><span class="pill">412</span></button>
      <button class="navitem" data-page="knowledge"><span class="ico">&#9776;</span><span class="lbl">Knowledge</span></button>
      <button class="navitem" data-page="spend"><span class="ico">&#8942;</span><span class="lbl">Spend</span></button>
      <button class="navitem" data-page="settings"><span class="ico">&#9881;</span><span class="lbl">Settings</span></button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="iconbtn mobonly" id="burger" style="display:none">&#9776;</button>
      <div class="title">
        <div class="av" id="hdAv"><img alt=""></div>
        <h2 id="hdName">Atelier</h2>
        <span class="tagline" id="hdTag"></span>
      </div>
      <div class="views" id="views">
        <button data-view="chat">Chat</button>
        <button data-view="build">Build</button>
        <button data-view="canvas">Canvas</button>
      </div>
      <button class="iconbtn" title="Agent settings">&#9881;</button>
      <button class="iconbtn paneltoggle on" id="panelToggle" title="Toggle side panel">&#9707;</button>
    </div>
    <div class="stage"><div class="pad" id="stage"></div></div>
    <div class="composer" id="composer">
      <div class="cbox">
        <span>Message Atelier</span>
        <div class="chip">Attach</div><div class="chip">Bundle</div><div class="chip send">Send</div>
      </div>
    </div>
  </main>

  <aside class="work" id="work">
    <div class="workhd"><div class="wt" id="workTitle">Run 0114</div><span class="tag wait" id="workTag">Blocked</span><button class="workclose" id="workClose" title="Close panel">&#10005;</button></div>
    <div class="workbd" id="workBody"></div>
  </aside>

  <nav class="tabbar mobonly" id="tabbar">
    <button data-tab="threads"><span class="ti">&#9776;</span>Threads</button>
    <button data-tab="work" class="on"><span class="ti">&#9679;</span>Work</button>
    <button data-tab="panel"><span class="ti">&#9723;</span>Output</button>
    <button data-tab="library"><span class="ti">&#9635;</span>Library</button>
  </nav>
</div>

const av = (id,cls="") => `<span class="av ${cls}" style="background:${AGENTS[id].color}"><img src="${ICON}" alt=""></span>`;
const state = {agent:"atelier", view:"chat", page:null, setAgent:"atelier", setSection:"agent", kTab:"library", workOpen:true};

function renderThreads(){
  document.getElementById("threads").innerHTML = Object.keys(AGENTS).map(id=>{
    const a=AGENTS[id];
    return `<button class="thread ${state.page===null&&state.agent===id?'on':''}" data-agent="${id}">
      ${av(id)}
      <div class="meta">
        <div class="top"><div class="nm">${a.name}</div><div class="tm">${a.time}</div></div>
        <div class="pv">${a.preview}</div>
      </div>${a.flag?'<span class="flag"></span>':''}
    </button>`;}).join("");
  document.querySelectorAll("[data-agent]").forEach(b=>b.onclick=()=>{
    state.agent=b.dataset.agent; state.page=null;
    if(!AGENTS[state.agent].views.includes(state.view)) state.view="chat";
    document.getElementById("app").classList.remove("drawer");
    render();});
  document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{state.page=b.dataset.page;document.getElementById("app").classList.remove("drawer");render();});
}

function render(){
  renderThreads();
  const stage=document.getElementById("stage"), views=document.getElementById("views"),
        composer=document.getElementById("composer"), app=document.getElementById("app"),
        hdAv=document.getElementById("hdAv");

  if(state.page){
    const p=PAGES[state.page];
    hdAv.style.background="#3A3434"; hdAv.querySelector("img").src=ICON; hdAv.style.filter="grayscale(1)";
    document.getElementById("hdName").textContent="MARCO";
    document.getElementById("hdTag").textContent=p.title.toLowerCase()+". "+p.sub;
    views.classList.add("hidden"); composer.style.display="none"; app.classList.add("no-work");
    document.getElementById("panelToggle").style.display="none";
    stage.parentElement.classList.remove("bleed");
    stage.style.maxWidth="1000px";
    stage.innerHTML=`<div class="pagehd"><h3>${p.title}</h3><span class="sub">${p.sub}</span></div>`+
      (state.page==="settings"?settingsHTML():state.page==="knowledge"?knowledgeHTML():state.page==="newagent"?newAgentHTML():p.body);
    if(state.page==="settings"){
      document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{state.setAgent=b.dataset.set;state.setSection="agent";render();});
      document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{state.setSection=b.dataset.sec;render();});
    }
    if(state.page==="newagent"){
      const setColor=(c)=>{
        document.getElementById("naAv").style.background=c;
        document.getElementById("naHex").textContent=c.toUpperCase();
        document.getElementById("naPick").value=c;};
      document.querySelectorAll("[data-swatch]").forEach(b=>b.onclick=()=>{
        document.querySelectorAll("[data-swatch]").forEach(x=>x.classList.remove("on"));
        b.classList.add("on"); setColor(b.dataset.swatch);});
      document.getElementById("naPick").oninput=(e)=>{
        document.querySelectorAll("[data-swatch]").forEach(x=>x.classList.remove("on"));
        setColor(e.target.value);};
      document.getElementById("naRandom").onclick=()=>{
        const c="#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0");
        document.querySelectorAll("[data-swatch]").forEach(x=>x.classList.remove("on"));
        setColor(c);};
    }
    if(state.page==="knowledge") document.querySelectorAll("[data-ktab]").forEach(b=>b.onclick=()=>{state.kTab=b.dataset.ktab;render();});
    document.querySelectorAll(".navitem").forEach(n=>n.classList.toggle("on",n.dataset.page===state.page));
    return;
  }

  document.querySelectorAll(".navitem").forEach(n=>n.classList.remove("on"));
  const a=AGENTS[state.agent];
  hdAv.style.background=a.color; hdAv.style.filter="none"; hdAv.querySelector("img").src=ICON;
  document.getElementById("hdName").textContent=a.name;
  document.getElementById("hdTag").textContent=a.tag;
  composer.style.display="block"; composer.querySelector("span").textContent="Message "+a.name;

  views.classList.remove("hidden");
  views.querySelectorAll("button").forEach(b=>{
    b.style.display=a.views.includes(b.dataset.view)?"block":"none";
    b.classList.toggle("on",b.dataset.view===state.view);});

  const isCanvas = state.view==="canvas";
  stage.parentElement.classList.toggle("bleed", isCanvas);
  stage.style.maxWidth = isCanvas ? "none" : (state.view==="build" ? "700px" : "830px");
  composer.style.display = isCanvas ? "none" : "block";
  if(state.view==="chat") stage.innerHTML=CHAT[state.agent];
  else if(state.view==="build") stage.innerHTML=buildView(state.agent);
  else stage.innerHTML=CANVAS;

  const w=workHTML();
  app.classList.toggle("no-work", !state.workOpen);
  document.getElementById("panelToggle").classList.toggle("on", state.workOpen);
  document.getElementById("panelToggle").style.display="grid";
  if(w){
    const wb=document.getElementById("workBody");
    document.getElementById("workTitle").textContent=w.title;
    document.getElementById("workTag").outerHTML=w.tag.replace('class="tag','id="workTag" class="tag');
    wb.innerHTML=w.raw||w.body;
    wb.style.padding = w.raw ? "0" : "16px";
  }
}
document.querySelectorAll("#views button").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render();});

const APP=document.getElementById("app");
const isMobile=()=>window.matchMedia("(max-width:900px)").matches;

document.getElementById("railToggle").onclick=()=>{
  if(isMobile()) APP.classList.toggle("drawer");
  else APP.classList.toggle("mini");
};
document.getElementById("burger").onclick=()=>APP.classList.toggle("drawer");
document.getElementById("scrim").onclick=()=>APP.classList.remove("drawer");

document.getElementById("panelToggle").onclick=()=>{
  if(isMobile()){APP.classList.toggle("sheet");return;}
  state.workOpen=!state.workOpen;render();};
document.getElementById("workClose").onclick=()=>{
  if(isMobile()){APP.classList.remove("sheet");return;}
  state.workOpen=false;render();};

document.querySelectorAll("#tabbar button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#tabbar button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  const t=b.dataset.tab;
  APP.classList.remove("drawer","sheet");
  if(t==="threads"){APP.classList.add("drawer");}
  else if(t==="panel"){APP.classList.add("sheet");}
  else if(t==="library"){state.page="knowledge";render();}
  else {state.page=null;render();}
});

function syncMobile(){
  const m=isMobile();
  document.getElementById("burger").style.display=m?"grid":"none";
  document.getElementById("railToggle").innerHTML=m?"&#10005;":"&#9776;";
  if(!m) APP.classList.remove("drawer","sheet");
}
window.addEventListener("resize",syncMobile);
syncMobile();

render();
</script>
</body>
</html>
